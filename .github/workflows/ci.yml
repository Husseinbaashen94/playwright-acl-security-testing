name: ACL & Security Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secure-app:
    name: Suite passes against the secure app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: playwright-report
          retention-days: 14

  detection:
    name: Suite catches every planted vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs the suite against VULNERABLE=1 and fails if any planted flaw goes undetected.
      - run: npm run verify:detection
